# Copia documental de los Virtual Hosts de agenda.test.
# Configuración activa:
# C:/xampp/apache/conf/extra/httpd-vhosts.conf
#
# Requiere los módulos: proxy, proxy_http, ssl y headers.
# Requiere que Apache ya escuche en los puertos 80 y 443.
# Entrada necesaria en el archivo hosts de Windows:
# 127.0.0.1 agenda.test
#
# Los certificados deben generarse en cada equipo.
# No incluir claves privadas en el repositorio.

# Redirección de HTTP a HTTPS
<VirtualHost *:80>
    ServerName agenda.test

    <Location "/">
        Require local
    </Location>

    Redirect permanent "/" "https://agenda.test/"
</VirtualHost>

# HTTPS y proxy hacia Express
<VirtualHost *:443>
    ServerName agenda.test

    SSLEngine on
    SSLCertificateFile "C:/xampp/apache/conf/ssl-agenda/agenda.test.pem"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl-agenda/agenda.test-key.pem"
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyRequests Off
    ProxyPreserveHost On

    <Location "/">
        Require local
    </Location>

    ProxyPass "/" "http://127.0.0.1:3000/"
    ProxyPassReverse "/" "http://127.0.0.1:3000/"

    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    Header always set Strict-Transport-Security "max-age=86400"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog "logs/agenda-test-ssl-error.log"
    CustomLog "logs/agenda-test-ssl-access.log" combined
</VirtualHost>